<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="60%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#1A0D2E" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#00FFCC" />
    </linearGradient>
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#00FFCC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00FFCC" stop-opacity="1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="1000" height="200" fill="url(#skyGrad)" />

  <!-- Stars -->
  <circle cx="90" cy="35" r="1.5" fill="#00FFCC" opacity="0.8" />
  <circle cx="210" cy="20" r="1.2" fill="#FFFFFF" opacity="0.6" />
  <circle cx="340" cy="45" r="2" fill="#FF007F" opacity="0.8" />
  <circle cx="680" cy="25" r="1.5" fill="#00FFCC" opacity="0.8" />
  <circle cx="810" cy="40" r="2" fill="#FFFFFF" opacity="0.7" />
  <circle cx="920" cy="18" r="1.5" fill="#FF7700" opacity="0.7" />

  <!-- Retro Sun on Horizon -->
  <circle cx="500" cy="115" r="50" fill="url(#sunGrad)" filter="url(#neonGlow)" />
  <!-- Sun Scanlines -->
  <rect x="440" y="98" width="120" height="3" fill="#0D1117" />
  <rect x="440" y="105" width="120" height="4" fill="#0D1117" />
  <rect x="440" y="113" width="120" height="5" fill="#0D1117" />
  <rect x="440" y="122" width="120" height="6" fill="#0D1117" />

  <!-- Horizon Line -->
  <line x1="0" y1="125" x2="1000" y2="125" stroke="#00FFCC" stroke-width="2" filter="url(#neonGlow)" />

  <!-- 3D Perspective Grid -->
  <line x1="500" y1="125" x2="-80" y2="200" stroke="url(#gridFade)" stroke-width="1.5" />
  <line x1="500" y1="125" x2="60" y2="200" stroke="url(#gridFade)" stroke-width="1.5" />
  <line x1="500" y1="125" x2="200" y2="200" stroke="url(#gridFade)" stroke-width="1.5" />
  <line x1="500" y1="125" x2="350" y2="200" stroke="url(#gridFade)" stroke-width="1.5" />
  <line x1="500" y1="125" x2="500" y2="200" stroke="url(#gridFade)" stroke-width="2" filter="url(#neonGlow)" />
  <line x1="500" y1="125" x2="650" y2="200" stroke="url(#gridFade)" stroke-width="1.5" />
  <line x1="500" y1="125" x2="800" y2="200" stroke="url(#gridFade)" stroke-width="1.5" />
  <line x1="500" y1="125" x2="940" y2="200" stroke="url(#gridFade)" stroke-width="1.5" />
  <line x1="500" y1="125" x2="1080" y2="200" stroke="url(#gridFade)" stroke-width="1.5" />

  <!-- Horizontal Grid Lines -->
  <line x1="0" y1="133" x2="1000" y2="133" stroke="#00FFCC" stroke-width="1" opacity="0.4" />
  <line x1="0" y1="145" x2="1000" y2="145" stroke="#00FFCC" stroke-width="1.2" opacity="0.6" />
  <line x1="0" y1="162" x2="1000" y2="162" stroke="#00FFCC" stroke-width="1.6" opacity="0.8" />
  <line x1="0" y1="185" x2="1000" y2="185" stroke="#00FFCC" stroke-width="2.2" opacity="0.95" filter="url(#neonGlow)" />

  <!-- Retro Typography -->
  <text x="500" y="45" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#00FFCC" text-anchor="middle" letter-spacing="4" filter="url(#neonGlow)">
    THANKS FOR VISITING // GAME SAVED
  </text>
  <text x="500" y="65" font-family="'Courier New', monospace" font-size="11" fill="#FF007F" text-anchor="middle" letter-spacing="3">
    [ STAGE 01 CLEAR - READY FOR PRODUCTION ]
  </text>
</svg>
